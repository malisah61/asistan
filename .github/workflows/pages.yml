name: Web

# Web sürümü: www/ klasörü GitHub Pages'te yayınlanır (https://<kullanıcı>.github.io/asistan/).
# Görevler yine bulutta (gorev.yml) çalışır; web yalnızca arayüzdür.

on:
  push:
    branches: [main]
    paths: ['www/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Hazırla ve yayınla ayrı işler: tek işte paket yüklenir yüklenmez yayınlamaya çalışınca
  # GitHub paketi henüz göremeyip "No artifacts named github-pages" hatası verebiliyor.
  hazirla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Tarayıcı ve Pages önbelleği eski JS'i göstermesin: her yayında adreslere sürüm eklenir
      - name: Sürüm etiketi
        run: |
          v=${GITHUB_SHA::7}
          sed -i -E "s#(src|href)=\"(js/app\.js|style\.css)\"#\1=\"\2?v=$v\"#g" www/index.html
          sed -i -E "s#from '\./([a-z]+)\.js'#from './\1.js?v=$v'#g" www/js/*.js
          grep -h "?v=" www/index.html www/js/*.js | head -3
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

  yayinla:
    needs: hazirla
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    steps:
      - id: dagit
        uses: actions/deploy-pages@v4
